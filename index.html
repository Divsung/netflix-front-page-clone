<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Front Page Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="interface"></div>
        <div class="navbar">   
            <div class="netflix-logo">
                <img src="images/netflix logo.svg">
            </div>
            <div class="language-signin">
                <img class="lang-img" src="images/language-logo.png">
                <select class="language">
                    <option value="en"> English</option>
                    <option value="hi">Hindi</option>
                </select>
                <button class="signin-btn">Sign In</button>
            </div> 
        </div>
        <div class="hero-content">
            <pre><h1 class="main-heading">Plot twist: New hits,
every single week</h1></pre>
            <h3 class="sub-heading1">Starts at ₹149. Cancel at any time.</h3>
            <p class="sub-heading2">Ready to watch? Enter your email to create or restart your membership.</p>
            <div class="email-form">
                <input type="email" placeholder="Email address" class="email-input">
                <button class="get-started-btn">Get Started <i id="arrow-sign" class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </header>
    <section class="curve-section">
       <p class="curve-text">Trending Now</p>
            <div class="movie-section">

                <div class="movie-card">
                    <div class="movie-1">
                        <img class="one" src="images/no1.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-2">
                        <img class="two" src="images/no2.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-3">
                        <img class="three" src="images/no3.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-4">
                        <img class="four" src="images/no4.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-5">
                        <img class="five" src="images/no5.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-6">
                        <img class="six" src="images/no6.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-7">
                        <img class="seven" src="images/no7.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-8">
                        <img class="eight" src="images/no8.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-9">
                        <img class="nine" src="images/no9.png">
                    </div>
                </div>

                <div class="movie-card">
                    <div class="movie-10">
                        <img class="tenth" src="images/no10.png">
                    </div>
                </div>

            </div>
       </div>
    </section>
</body>
</html>
